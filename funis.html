<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funis & Campanhas · STEIO</title>
<style>
  :root{--bg:#0a0e1a;--bg2:#0d1220;--card:#121a2e;--line:rgba(255,255,255,.08);--txt:#eaf0ff;--muted:#8a97b8;
    --accent:#3b82f6;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--teal:#2dd4bf;--purple:#a78bfa;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;font-size:14px}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 16px 70px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  h1{font-size:18px;font-weight:800}.sub{color:var(--muted);font-size:12px}
  .periods{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
  .pill{background:var(--card);border:1px solid var(--line);color:var(--muted);padding:6px 13px;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:600}
  .pill.active{background:var(--accent);color:#fff;border-color:transparent}
  .kgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:8px}
  .kc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .kc .kl{color:var(--muted);font-size:11px}.kc .kv{font-size:22px;font-weight:800;margin-top:3px;letter-spacing:-.02em}
  .kc.g .kv{color:var(--green)}.kc.t .kv{color:var(--teal)}.kc.b .kv{color:var(--accent)}.kc.p .kv{color:var(--purple)}
  .stitle{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:24px 0 10px}
  .fcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
  .fcard .fh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .fcard .fn{font-weight:800;font-size:15px}
  .fcard .costs{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
  .fcard .costs b{color:var(--txt)}
  .steps{display:flex;gap:6px;overflow-x:auto}
  .step{flex:1;min-width:82px;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px 8px;text-align:center}
  .step .sv{font-size:19px;font-weight:800}.step .sl{font-size:10.5px;color:var(--muted);margin-top:2px}
  .step .sp{font-size:10px;color:var(--teal);margin-top:1px}
  table.fx{width:100%;border-collapse:collapse;font-size:12.5px}
  table.fx th,table.fx td{padding:8px 9px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
  table.fx th:first-child,table.fx td:first-child{text-align:left}
  table.fx th{color:var(--muted);font-weight:600;font-size:10.5px;text-transform:uppercase}
  table.fx td{font-variant-numeric:tabular-nums}
  .tagf{display:inline-block;background:var(--bg2);border:1px solid var(--line);border-radius:999px;padding:1px 7px;font-size:10px;color:var(--muted);margin-left:6px}
  .foot{color:var(--muted);font-size:11px;margin-top:22px;text-align:center}
  @media(max-width:820px){.kgrid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:560px){.kgrid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Funis & Campanhas</h1><div class="sub" id="periodo">carregando...</div></div>
    <a href="/" style="color:var(--teal);font-size:13px;text-decoration:none">← Comando</a>
  </header>
  <div class="periods" id="periods">
    <button class="pill" data-r="hoje">Hoje</button>
    <button class="pill" data-r="7d">7 dias</button>
    <button class="pill active" data-r="mes">Este mês</button>
    <button class="pill" data-r="30d">30 dias</button>
  </div>
  <div id="view">Carregando...</div>
  <div class="foot" id="foot"></div>
</div>
<script>
const API='https://steio.vercel.app/api/dc-metrics';
const money=n=>n==null?'—':'R$ '+Math.round(n).toLocaleString('pt-BR');
const n0=n=>(n||0).toLocaleString('pt-BR');
function range(r){ const d=new Date(); const f=x=>x.toISOString().slice(0,10); let s=new Date(d);
  if(r==='hoje')return{since:f(d),until:f(d)};
  if(r==='7d'){s.setDate(d.getDate()-6);return{since:f(s),until:f(d)};}
  if(r==='30d'){s.setDate(d.getDate()-29);return{since:f(s),until:f(d)};}
  return{since:d.toISOString().slice(0,8)+'01',until:f(d)}; }
const STEPS=[['leads','Chegaram'],['qualificados','Qualif.'],['responderam','Respond.'],['agendaram','Agendaram'],['compareceram','Compar.'],['venderam','Venderam']];
async function load(r){
  const {since,until}=range(r);
  document.getElementById('view').innerHTML='Carregando...';
  let d; try{ d=await (await fetch(`${API}?since=${since}&until=${until}`)).json(); }catch(e){ document.getElementById('view').innerHTML='Erro ao carregar.'; return; }
  document.getElementById('periodo').textContent=`${since} a ${until}`;
  const t=d.total||{};
  const kc=(l,v,cls)=>`<div class="kc ${cls||''}"><div class="kl">${l}</div><div class="kv">${v}</div></div>`;
  let html='<div class="kgrid">'
    +kc('Leads',n0(t.leads))+kc('Qualificados',n0(t.qualificados),'t')+kc('Agendaram',n0(t.agendaram),'b')
    +kc('Venderam',n0(t.venderam),'g')+kc('Faturamento',money(t.faturamento),'g')+kc('Investido',money(t.spend),'p')+'</div>';
  // FUNIS (cards com o funil comercial)
  html+='<div class="stitle">Por funil</div>';
  (d.funis||[]).forEach(f=>{
    const steps=STEPS.map(([k,lab],i)=>{ const base=f.leads||1; const pct=i>0?Math.round(100*f[k]/base):100;
      return `<div class="step"><div class="sv">${n0(f[k])}</div><div class="sl">${lab}</div>${i>0?`<div class="sp">${pct}%</div>`:''}</div>`; }).join('');
    html+=`<div class="fcard"><div class="fh"><div class="fn">${f.nome}</div>
      <div class="costs"><span>CPL <b>${money(f.cpl)}</b></span><span>CPM <b>${money(f.cpm)}</b></span><span>Custo/agend. <b>${money(f.custoAgendamento)}</b></span><span>Custo/venda <b>${money(f.custoVenda)}</b></span><span>Fat. <b style="color:var(--green)">${money(f.faturamento)}</b></span><span>Investido <b>${money(f.spend)}</b></span></div>
    </div><div class="steps">${steps}</div></div>`;
  });
  // CAMPANHAS (tabela gerenciador)
  html+='<div class="stitle">Por campanha</div><div style="overflow-x:auto"><table class="fx"><thead><tr>'
    +'<th>Campanha</th><th>Invest.</th><th>Chegaram</th><th>Qualif.</th><th>Respond.</th><th>Agend.</th><th>Compar.</th><th>Vendas</th><th>Faturam.</th><th>CPL</th><th>Custo/venda</th></tr></thead><tbody>';
  (d.campanhas||[]).forEach(c=>{ html+=`<tr><td>${c.nome} <span class="tagf">${c.funil}</span></td><td>${money(c.spend)}</td><td>${n0(c.leads)}</td><td>${n0(c.qualificados)}</td><td>${n0(c.responderam)}</td><td>${n0(c.agendaram)}</td><td>${n0(c.compareceram)}</td><td>${n0(c.venderam)}</td><td style="color:var(--green)">${money(c.faturamento)}</td><td>${money(c.cpl)}</td><td>${money(c.custoVenda)}</td></tr>`; });
  html+='</tbody></table></div>';
  document.getElementById('view').innerHTML=html;
  document.getElementById('foot').textContent='Atualizado '+new Date(d.atualizadoEm).toLocaleString('pt-BR')+' · esteira (dc_leads) + Meta Ads';
}
document.getElementById('periods').addEventListener('click',e=>{const b=e.target.closest('.pill');if(!b)return;
  document.querySelectorAll('.pill').forEach(p=>p.classList.toggle('active',p===b)); load(b.dataset.r);});
load('mes');
</script>
</body>
</html>
